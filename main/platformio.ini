; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
board_build.flash_mode = dio
board_build.flash_size = 8MB
monitor_speed = 115200
upload_speed = 921600
lib_deps = 
	bodmer/TFT_eSPI @ 2.5.43
	https://github.com/aselectroworks/Arduino-FT6336U.git
	lvgl/lvgl @ 9.4.0
	bblanchon/ArduinoJson@ 7.4.2
	gin66/FastAccelStepper@ 0.33.12
	adafruit/Adafruit NeoPixel@ 1.15.3
build_flags =
    -Iinclude
    ; Force TFT_eSPI to use the project's User_Setup.h instead of the
    ; default copy inside .pio/libdeps (which is machine-local and not in git)
    -DUSER_SETUP_LOADED=1
    -include src/User_Setup.h